[workspace]
members = []
resolver = "2"

[package]
name = "detent"
version = "0.1.0"
edition = "2021"

[features]
default = []
xsd-validation = ["libxml"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
regex = "1.12.2"
libxml = { version = "0.3", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
cucumber = "0.23"
predicates = "3.1"
serde_test = "1.0.177"
tempfile = "3.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
